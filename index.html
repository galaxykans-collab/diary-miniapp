<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дневник</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #fff);
            --text: var(--tg-theme-text-color, #000);
            --hint: var(--tg-theme-hint-color, #999);
            --btn: var(--tg-theme-button-color, #3390ec);
            --btn-text: var(--tg-theme-button-text-color, #fff);
            --secondary: var(--tg-theme-secondary-bg-color, #f4f4f5);
            --danger: #d32f2f;
            --success: #388e3c;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        .tabs { display: flex; background: var(--secondary); position: sticky; top: 0; z-index: 10; }
        .tab { flex: 1; padding: 14px; text-align: center; font-size: 14px; cursor: pointer; color: var(--hint); border-bottom: 2px solid transparent; }
        .tab.active { color: var(--btn); border-bottom-color: var(--btn); font-weight: 600; }

        .container { padding: 16px; }
        .task-list { display: flex; flex-direction: column; gap: 10px; }
        
        .task-item { display: flex; align-items: center; padding: 12px; background: var(--secondary); border-radius: 10px; }
        .checkbox { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--hint); margin-right: 12px; flex-shrink: 0; cursor: pointer; }
        .task-content { flex-grow: 1; cursor: pointer; }
        .task-date { font-size: 12px; color: var(--hint); margin-top: 4px; }
        .task-date.overdue { color: var(--danger); font-weight: bold; }
        .task-author { font-size: 12px; color: var(--btn); margin-top: 2px; font-weight: 500; }
        .task-status { font-size: 12px; font-weight: bold; margin-top: 4px; }
        
        .edit-icon { margin-left: 10px; font-size: 18px; opacity: 0.6; cursor: pointer; padding: 5px; }
        
        .fab { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--btn); color: var(--btn-text); font-size: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 20; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: var(--bg); width: 90%; max-width: 400px; border-radius: 16px; padding: 20px; box-sizing: border-box; }
        .modal h2 { margin-top: 0; font-size: 18px; margin-bottom: 16px; }
        
        .modal input, .modal select { width: 100%; padding: 12px; margin-bottom: 12px; box-sizing: border-box; border-radius: 8px; border: 1px solid var(--hint); background: var(--secondary); color: var(--text); font-size: 16px; }
        
        .date-section { margin-bottom: 16px; }
        .date-row { display: flex; gap: 10px; margin-bottom: 8px; }
        .date-row input[type="date"] { margin-bottom: 0; flex-grow: 1; }
        .btn-clear-date { background: var(--secondary); color: var(--danger); border: 1px solid var(--hint); border-radius: 8px; cursor: pointer; padding: 0 15px; font-size: 20px; }
        
        .quick-days { display: flex; gap: 6px; flex-wrap: wrap; }
        .quick-days button { flex: 1; padding: 8px 4px; font-size: 12px; background: var(--secondary); color: var(--text); border: 1px solid var(--hint); border-radius: 6px; cursor: pointer; white-space: nowrap; }
        .quick-days button:active { background: var(--btn); color: var(--btn-text); }

        .remind-section { margin-bottom: 16px; border-top: 1px solid var(--secondary); padding-top: 12px; }
        .remind-toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; margin-bottom: 10px; font-size: 15px; }
        .remind-toggle input { width: 18px; height: 18px; }
        
        .remind-days-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
        .day-btn { flex: 1; min-width: 30px; padding: 8px 0; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; background: var(--secondary); color: var(--text); border: 1px solid var(--hint); }
        .day-btn.selected { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
        .btn-select-all { 
            flex: 0 0 auto; 
            padding: 8px 12px; 
            font-size: 12px; 
            background: var(--secondary); 
            color: var(--text); 
            border: 1px solid var(--hint); 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
        }
        .btn-select-all:active { 
            background: var(--btn); 
            color: var(--btn-text); 
        }

        .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
        .modal-actions button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 16px; cursor: pointer; }
        .btn-cancel { background: var(--secondary); color: var(--text); }
        .btn-submit { background: var(--btn); color: var(--btn-text); }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; border-top: 1px solid var(--hint); padding-top: 20px; }
        .action-grid button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer; }
        .btn-delete { background: var(--danger); color: white; }
        .btn-transfer { background: #f39c12; color: white; }
        .btn-revive { background: var(--success); color: white; }
        
        .loader { text-align: center; color: var(--hint); margin-top: 20px; }
    </style>
</head>
<body>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('my', this)">📌 Мои</div>
        <div class="tab" onclick="switchTab('shared', this)">📨 Обмен</div>
        <div class="tab" onclick="switchTab('archive', this)">🗄 Архив</div>
    </div>

    <div class="container">
        <div id="task-list" class="task-list"><div class="loader">Загрузка...</div></div>
    </div>

    <button class="fab" onclick="openCreateModal()">+</button>

    <!-- Модалка создания -->
    <div id="create-modal" class="modal">
        <div class="modal-content">
            <h2>Новая задача</h2>
            <input type="text" id="new-text" placeholder="Что нужно сделать?">
            <div class="date-section" id="create-date-section">
                <div class="date-row">
                    <input type="date" id="new-date-input">
                    <button class="btn-clear-date" onclick="document.getElementById('new-date-input').value = ''" title="Без срока">✖</button>
                </div>
                <div class="quick-days">
                    <button onclick="setQuickDate('new-date-input', 0)">Сегодня</button>
                    <button onclick="setQuickDate('new-date-input', 1)">Завтра</button>
                    <button onclick="setQuickDate('new-date-input', 3)">+3 дня</button>
                    <button onclick="setQuickDate('new-date-input', 7)">+7 дней</button>
                </div>
            </div>
            
            <div class="remind-section">
                <label class="remind-toggle">
                    <input type="checkbox" id="new-remind-checkbox">
                    <span>🔔 Включить напоминание</span>
                </label>
                <div style="font-size: 12px; color: var(--hint);">Будет напоминать каждый день по утрам.</div>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('create-modal')">Отмена</button>
                <button class="btn-submit" onclick="createTask()">Создать</button>
            </div>
        </div>
    </div>

    <!-- Модалка редактирования -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h2>Задача</h2>
            <input type="text" id="edit-text" placeholder="Текст задачи">
            
            <div class="date-section" id="edit-date-section">
                <div class="date-row">
                    <input type="date" id="edit-date-input">
                    <button class="btn-clear-date" onclick="document.getElementById('edit-date-input').value = ''" title="Без срока">✖</button>
                </div>
                <div class="quick-days">
                    <button onclick="setQuickDate('edit-date-input', 0)">Сегодня</button>
                    <button onclick="setQuickDate('edit-date-input', 1)">Завтра</button>
                    <button onclick="setQuickDate('edit-date-input', 3)">+3 дня</button>
                    <button onclick="setQuickDate('edit-date-input', 7)">+7 дней</button>
                </div>
            </div>
            
            <div class="remind-section" id="edit-remind-section">
                <label class="remind-toggle">
                    <input type="checkbox" id="edit-remind-checkbox" onchange="toggleRemindDays()">
                    <span>🔔 Включить напоминание</span>
                </label>
                
                <!-- Блок Утро/Вечер -->
                <div class="remind-time-container" id="remind-time-container" style="display: none; margin-bottom: 10px;">
                    <div style="font-size: 13px; color: var(--hint); margin-bottom: 5px;">Когда напоминать?</div>
                    <div style="display: flex; gap: 6px;">
                        <button class="time-btn" id="time-morning" onclick="setRemindTime('morning')" style="flex:1; padding: 8px; border-radius: 6px; border: 1px solid var(--hint); background: var(--secondary); color: var(--text); cursor: pointer;">🌅 Утро</button>
                        <button class="time-btn" id="time-evening" onclick="setRemindTime('evening')" style="flex:1; padding: 8px; border-radius: 6px; border: 1px solid var(--hint); background: var(--secondary); color: var(--text); cursor: pointer;">🌙 Вечер</button>
                    </div>
                </div>

                <div id="edit-remind-days-wrapper" style="display: none;">
                    <div class="remind-days-container" id="remind-days-container">
                        <!-- Кнопки дней недели -->
                    </div>
                </div>
            </div>
            
            <div class="action-grid" id="action-buttons">
                <button class="btn-transfer" id="btn-transfer" onclick="openTransferModal()">➡️ Передать</button>
                <button class="btn-delete" id="btn-cancel-task" onclick="cancelTask()">🚫 Снять</button>
                <button class="btn-revive" id="btn-return" onclick="returnTask()">↩️ Вернуть себе</button>
                <button class="btn-revive" id="btn-revive" onclick="reviveTask()">🔄 Восстановить</button>
                <button class="btn-delete" id="btn-delete-hard" onclick="deleteHardTask()">🗑 Удалить</button>
                <button class="btn-delete" id="btn-reject" onclick="rejectTask()">🚫 Отклонить</button>
                <button class="btn-cancel" onclick="closeModal('edit-modal')">Назад</button>
                <button class="btn-submit" id="btn-save-edit" onclick="saveEdit()">Сохранить</button>
            </div>
        </div>
    </div>

    <div id="transfer-modal" class="modal">
        <div class="modal-content">
            <h2>Передать задачу</h2>
            <input type="text" id="transfer-username" placeholder="@username получателя">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('transfer-modal')">Отмена</button>
                <button class="btn-submit" onclick="transferTask()">Передать</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id;
        const API_URL = "https://diary-render.onrender.com"; // ТВОЯ ССЫЛКА RENDER

        const listElement = document.getElementById('task-list');
        let currentTab = 'my';
        let editingTaskId = null;
        let currentTaskAuthorId = null;
        
        const daysOfWeek = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        let selectedDays = []; 
        let currentRemindTime = 'morning'; // По умолчанию утро

        function renderDayButtons() {
            const container = document.getElementById('remind-days-container');
            container.innerHTML = '';
            
            // Кнопка "Все"
            const allBtn = document.createElement('button');
            allBtn.className = 'btn-select-all';
            allBtn.innerText = 'Все';
            allBtn.onclick = () => {
                if (selectedDays.length === 7) {
                    selectedDays = []; 
                } else {
                    selectedDays = [1,2,3,4,5,6,7]; 
                }
                renderDayButtons();
            };
            container.appendChild(allBtn);

            // Кнопки дней
            daysOfWeek.forEach((day, index) => {
                const dayNum = index + 1;
                const isSelected = selectedDays.includes(dayNum);
                const btn = document.createElement('button');
                btn.className = `day-btn ${isSelected ? 'selected' : ''}`;
                btn.innerText = day;
                btn.onclick = () => {
                    if (selectedDays.includes(dayNum)) {
                        selectedDays = selectedDays.filter(d => d !== dayNum);
                    } else {
                        selectedDays.push(dayNum);
                        selectedDays.sort(); 
                    }
                    renderDayButtons();
                };
                container.appendChild(btn);
            });
        }

        // НОВЫЕ ФУНКЦИИ ДЛЯ ВРЕМЕНИ
        function setRemindTime(time) {
            currentRemindTime = time;
            updateTimeButtons();
        }

        function updateTimeButtons() {
            const btnMorning = document.getElementById('time-morning');
            const btnEvening = document.getElementById('time-evening');
            
            if (currentRemindTime === 'morning') {
                btnMorning.style.background = 'var(--btn)';
                btnMorning.style.color = 'var(--btn-text)';
                btnEvening.style.background = 'var(--secondary)';
                btnEvening.style.color = 'var(--text)';
            } else {
                btnEvening.style.background = 'var(--btn)';
                btnEvening.style.color = 'var(--btn-text)';
                btnMorning.style.background = 'var(--secondary)';
                btnMorning.style.color = 'var(--text)';
            }
        }

        function toggleRemindDays() {
            const isChecked = document.getElementById('edit-remind-checkbox').checked;
            document.getElementById('edit-remind-days-wrapper').style.display = isChecked ? 'block' : 'none';
            document.getElementById('remind-time-container').style.display = isChecked ? 'block' : 'none';
        }

        function setQuickDate(inputId, days) {
            const d = new Date();
            d.setDate(d.getDate() + days);
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            document.getElementById(inputId).value = `${yyyy}-${mm}-${dd}`;
        }

        function switchTab(tab, element) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            loadTasks();
        }

        function openCreateModal() {
            document.getElementById('new-text').value = '';
            document.getElementById('new-date-input').value = '';
            document.getElementById('new-remind-checkbox').checked = false;
            document.getElementById('create-modal').classList.add('show');
            document.getElementById('new-text').focus();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        async function loadTasks() {
            if (!userId) { listElement.innerHTML = '<div class="loader">Нет ID</div>'; return; }
            listElement.innerHTML = '<div class="loader">Загрузка...</div>';
            
            let endpoint = `/tasks/${userId}`;
            if (currentTab === 'shared') endpoint = `/tasks/shared/${userId}`;
            if (currentTab === 'archive') endpoint = `/tasks/archive/${userId}`;
            
            const todayStr = new Date().toISOString().split('T')[0];
            
            try {
                const response = await fetch(`${API_URL}${endpoint}`, { headers: { "ngrok-skip-browser-warning": "true" } });
                const tasks = await response.json();
                
                if (tasks.length === 0) {
                    listElement.innerHTML = `<div class="loader">Пусто 🎉</div>`;
                    return;
                }
                listElement.innerHTML = '';
                tasks.forEach(task => {
                    const item = document.createElement('div');
                    item.className = 'task-item';
                    
                    let subText = '';
                    if (task.date_to) {
                        const isOverdue = (task.date_to < todayStr && currentTab !== 'archive');
                        const dateClass = isOverdue ? 'task-date overdue' : 'task-date';
                        const dateIcon = isOverdue ? '⚠️ ' : '';
                        subText = `<div class="${dateClass}">${dateIcon}до ${task.date_to}</div>`;
                    }
                    
                    if (currentTab === 'shared') {
                        const isAuthor = task.author_id === userId;
                        if (isAuthor) subText += `<div class="task-author">→ Отправлено: @${task.partner_name}</div>`;
                        else subText += `<div class="task-author">← Получено от: @${task.partner_name}</div>`;
                    }

                    if (currentTab === 'archive') {
                        const stText = task.status === 'done' ? '✅ Выполнено' : '✖️ Снято';
                        subText += `<div class="task-status" style="color: ${task.status === 'done' ? 'var(--success)' : 'var(--danger)'}">${stText}</div>`;
                    }

                    const safeBody = task.body.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    const remindIcon = task.remind ? ' 🔔' : '';
                    
                    let checkboxHTML = '';
                    if (currentTab === 'my') checkboxHTML = `<div class="checkbox" onclick="event.stopPropagation(); completeTask(${task.id}, this.parentElement)"></div>`;
                    if (currentTab === 'shared' && task.author_id !== userId) checkboxHTML = `<div class="checkbox" onclick="event.stopPropagation(); completeTask(${task.id}, this.parentElement)"></div>`;

                    // Передаем remind_time в openEditModal
                    const editIconHTML = currentTab === 'shared' ? '' : `<div class="edit-icon" onclick="event.stopPropagation(); openEditModal(${task.id}, '${safeBody}', ${task.author_id || 0}, '${task.date_to || ''}', ${task.remind || false}, '${task.remind_days || ''}', '${task.remind_time || 'morning'}')">✏️</div>`;

                    item.innerHTML = `
                        ${checkboxHTML}
                        <div class="task-content" onclick="openEditModal(${task.id}, '${safeBody}', ${task.author_id || 0}, '${task.date_to || ''}', ${task.remind || false}, '${task.remind_days || ''}', '${task.remind_time || 'morning'}')">
                            <div>#${task.id} ${task.body}${remindIcon}</div>
                            ${subText}
                        </div>
                        ${editIconHTML}
                    `;
                    listElement.appendChild(item);
                });
            } catch (error) {
                listElement.innerHTML = '<div class="loader">Ошибка API</div>';
            }
        }

        async function completeTask(taskId, itemElement) {
            itemElement.style.opacity = 0.5;
            try {
                await fetch(`${API_URL}/tasks/complete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ task_id: taskId, user_id: userId })
                });
                itemElement.style.display = 'none';
            } catch (error) {
                itemElement.style.opacity = 1;
                alert('Ошибка закрытия');
            }
        }

        function openEditModal(taskId, currentText, authorId, currentDue, isRemind, remindDaysStr, remindTimeStr) {
            editingTaskId = taskId;
            currentTaskAuthorId = authorId;
            document.getElementById('edit-text').value = currentText;
            document.getElementById('edit-date-input').value = currentDue || '';
            
            document.getElementById('edit-remind-checkbox').checked = isRemind;
            
            // Инициализация времени
            currentRemindTime = remindTimeStr || 'morning';
            updateTimeButtons();

            // Инициализация выбранных дней
            if (isRemind && remindDaysStr) {
                selectedDays = remindDaysStr.split(',').map(Number).filter(n => !isNaN(n));
            } else {
                selectedDays = []; 
            }
            renderDayButtons();
            toggleRemindDays();

            document.getElementById('edit-modal').classList.add('show');

            const btnTransfer = document.getElementById('btn-transfer');
            const btnCancelTask = document.getElementById('btn-cancel-task');
            const btnReturn = document.getElementById('btn-return');
            const btnRevive = document.getElementById('btn-revive');
            const btnDeleteHard = document.getElementById('btn-delete-hard');
            const btnReject = document.getElementById('btn-reject');
            const editText = document.getElementById('edit-text');
            const dateSection = document.getElementById('edit-date-section');
            const remindSection = document.getElementById('edit-remind-section');
            const saveBtn = document.getElementById('btn-save-edit');

            [btnTransfer, btnCancelTask, btnReturn, btnRevive, btnDeleteHard, btnReject].forEach(b => b.style.display = 'none');
            
            if (currentTab === 'my') {
                btnTransfer.style.display = 'block';
                btnCancelTask.style.display = 'block';
                editText.disabled = false;
                dateSection.style.display = 'block';
                remindSection.style.display = 'block';
                saveBtn.style.display = 'block';
            } else if (currentTab === 'shared') {
                editText.disabled = true;
                dateSection.style.display = 'none';
                remindSection.style.display = 'none';
                saveBtn.style.display = 'none';
                if (currentTaskAuthorId === userId) {
                    btnReturn.style.display = 'block';
                    btnCancelTask.style.display = 'block';
                } else {
                    btnReject.style.display = 'block';
                }
            } else if (currentTab === 'archive') {
                btnRevive.style.display = 'block';
                btnDeleteHard.style.display = 'block';
                editText.disabled = false;
                dateSection.style.display = 'block';
                remindSection.style.display = 'block';
                saveBtn.style.display = 'block';
            }
        }

        async function saveEdit() {
            const fullText = document.getElementById('edit-text').value.trim();
            if (!fullText) { tg.showAlert("Текст не может быть пустым"); return; }
            const dateStr = document.getElementById('edit-date-input').value || null;
            
            let remind = document.getElementById('edit-remind-checkbox').checked;
            let remindDays = selectedDays.join(',');

            if (remind && selectedDays.length === 0) {
                remind = false;
            }

            try {
                const response = await fetch(`${API_URL}/tasks/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ 
                        task_id: editingTaskId, 
                        user_id: userId, 
                        full_text: fullText, 
                        date_str: dateStr,
                        remind: remind,
                        remind_days: remindDays,
                        remind_time: currentRemindTime // <--- Передаем время
                    })
                });
                if (!response.ok) throw new Error('Ошибка');
                closeModal('edit-modal');
                loadTasks();
            } catch (error) { tg.showAlert("Ошибка при сохранении"); }
        }

        async function cancelTask() {
            tg.showConfirm("Снять задачу? Она уйдет в архив.", async (confirmed) => {
                if (!confirmed) return;
                try {
                    await fetch(`${API_URL}/tasks/cancel`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                        body: JSON.stringify({ task_id: editingTaskId, user_id: userId })
                    });
                    closeModal('edit-modal');
                    loadTasks();
                } catch (e) { tg.showAlert("Ошибка"); }
            });
        }

        async function returnTask() {
            try {
                const res = await fetch(`${API_URL}/tasks/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ task_id: editingTaskId, user_id: userId })
                });
                if (!res.ok) throw new Error('Ошибка');
                closeModal('edit-modal');
                loadTasks();
            } catch (e) { tg.showAlert("Ошибка возврата"); }
        }

        async function rejectTask() {
            tg.showConfirm("Вернуть задачу отправителю?", async (confirmed) => {
                if (!confirmed) return;
                try {
                    await fetch(`${API_URL}/tasks/reject`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                        body: JSON.stringify({ task_id: editingTaskId, user_id: userId })
                    });
                    closeModal('edit-modal');
                    loadTasks();
                } catch (e) { tg.showAlert("Ошибка отклонения"); }
            });
        }

        async function reviveTask() {
            try {
                const res = await fetch(`${API_URL}/tasks/revive`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ task_id: editingTaskId, user_id: userId })
                });
                if (!res.ok) throw new Error('Ошибка');
                closeModal('edit-modal');
                loadTasks();
            } catch (e) { tg.showAlert("Ошибка восстановления"); }
        }

        async function deleteHardTask() {
            tg.showConfirm("Удалить навсегда?", async (confirmed) => {
                if (!confirmed) return;
                try {
                    await fetch(`${API_URL}/tasks/${editingTaskId}?user_id=${userId}`, {
                        method: 'DELETE',
                        headers: { 'ngrok-skip-browser-warning': 'true' }
                    });
                    closeModal('edit-modal');
                    loadTasks();
                } catch (e) { tg.showAlert("Ошибка удаления"); }
            });
        }

        function openTransferModal() {
            document.getElementById('transfer-username').value = '';
            closeModal('edit-modal');
            document.getElementById('transfer-modal').classList.add('show');
        }

        async function transferTask() {
            const username = document.getElementById('transfer-username').value.trim();
            if (!username) { tg.showAlert("Введите @username"); return; }
            try {
                const res = await fetch(`${API_URL}/tasks/transfer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ task_id: editingTaskId, from_user_id: userId, to_username: username })
                });
                if (!res.ok) throw new Error('Ошибка');
                closeModal('transfer-modal');
                loadTasks();
            } catch (e) { tg.showAlert("Ошибка передачи"); }
        }

        async function createTask() {
            const fullText = document.getElementById('new-text').value.trim();
            if (!fullText) { tg.showAlert("Напишите, что нужно сделать"); return; }
            const dateStr = document.getElementById('new-date-input').value || null;
            const remind = document.getElementById('new-remind-checkbox').checked;

            try {
                const response = await fetch(`${API_URL}/tasks/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ 
                        user_id: userId, 
                        full_text: fullText, 
                        date_str: dateStr,
                        remind: remind,
                        remind_time: "morning", // <--- При создании по умолчанию утро
                        remind_days: "1,2,3,4,5,6,7"
                    })
                });
                if (!response.ok) throw new Error('Ошибка');
                closeModal('create-modal');
                loadTasks();
            } catch (error) { tg.showAlert("Ошибка создания"); }
        }

        loadTasks();
    </script>
</body>
</html>
