<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дневник</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #fff);
            --text: var(--tg-theme-text-color, #000);
            --hint: var(--tg-theme-hint-color, #999);
            --btn: var(--tg-theme-button-color, #3390ec);
            --btn-text: var(--tg-theme-button-text-color, #fff);
            --secondary: var(--tg-theme-secondary-bg-color, #f4f4f5);
            --danger: #d32f2f;
            --success: #388e3c;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        .tabs { display: flex; background: var(--secondary); position: sticky; top: 0; z-index: 10; }
        .tab { flex: 1; padding: 14px; text-align: center; font-size: 14px; cursor: pointer; color: var(--hint); border-bottom: 2px solid transparent; }
        .tab.active { color: var(--btn); border-bottom-color: var(--btn); font-weight: 600; }

        .container { padding: 16px; }
        .task-list { display: flex; flex-direction: column; gap: 10px; }
        
        .task-item { display: flex; align-items: center; padding: 12px; background: var(--secondary); border-radius: 10px; }
        .checkbox { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--hint); margin-right: 12px; flex-shrink: 0; cursor: pointer; }
        .task-content { flex-grow: 1; cursor: pointer; }
        .task-date { font-size: 12px; color: var(--hint); margin-top: 4px; }
        .task-author { font-size: 12px; color: var(--btn); margin-top: 2px; font-weight: 500; }
        .task-status { font-size: 12px; font-weight: bold; margin-top: 4px; }
        
        .edit-icon { margin-left: 10px; font-size: 18px; opacity: 0.6; cursor: pointer; padding: 5px; }
        
        .fab { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--btn); color: var(--btn-text); font-size: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 20; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: var(--bg); width: 90%; max-width: 400px; border-radius: 16px; padding: 20px; box-sizing: border-box; }
        .modal h2 { margin-top: 0; font-size: 18px; margin-bottom: 16px; }
        .modal input, .modal select { width: 100%; padding: 12px; margin-bottom: 12px; box-sizing: border-box; border-radius: 8px; border: 1px solid var(--hint); background: var(--secondary); color: var(--text); font-size: 16px; }
        
        .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
        .modal-actions button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 16px; cursor: pointer; }
        .btn-cancel { background: var(--secondary); color: var(--text); }
        .btn-submit { background: var(--btn); color: var(--btn-text); }
        
        .danger-zone { display: flex; gap: 10px; margin-top: 20px; border-top: 1px solid var(--hint); padding-top: 20px; }
        .danger-zone button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer; }
        .btn-delete { background: var(--danger); color: white; }
        .btn-transfer { background: #f39c12; color: white; }
        .btn-revive { background: var(--success); color: white; }
        
        .loader { text-align: center; color: var(--hint); margin-top: 20px; }
    </style>
</head>
<body>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('my', this)">📌 Мои</div>
        <div class="tab" onclick="switchTab('shared', this)">📨 Обмен</div>
        <div class="tab" onclick="switchTab('archive', this)">🗄 Архив</div>
    </div>

    <div class="container">
        <div id="task-list" class="task-list"><div class="loader">Загрузка...</div></div>
    </div>

    <button class="fab" onclick="openCreateModal()">+</button>

    <!-- Модалка создания -->
    <div id="create-modal" class="modal">
        <div class="modal-content">
            <h2>Новая задача</h2>
            <input type="text" id="new-text" placeholder="Что нужно сделать?">
            <select id="new-days">
                <option value="">Без срока</option>
                <option value="0">Сегодня</option>
                <option value="1">Завтра</option>
                <option value="3">Через 3 дня</option>
                <option value="7">Через 7 дней</option>
            </select>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('create-modal')">Отмена</button>
                <button class="btn-submit" onclick="createTask()">Создать</button>
            </div>
        </div>
    </div>

    <!-- Модалка редактирования -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h2>Задача</h2>
            <input type="text" id="edit-text" placeholder="Текст задачи">
            <select id="edit-days">
                <option value="">Без срока</option>
                <option value="0">Сегодня</option>
                <option value="1">Завтра</option>
                <option value="3">Через 3 дня</option>
                <option value="7">Через 7 дней</option>
            </select>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('edit-modal')">Отмена</button>
                <button class="btn-submit" onclick="saveEdit()">Сохранить</button>
            </div>
            
            <div class="danger-zone" id="action-buttons">
                <!-- Кнопки для своих задач -->
                <button class="btn-transfer" id="btn-transfer" onclick="openTransferModal()">➡️ Передать</button>
                <button class="btn-delete" id="btn-archive" onclick="cancelTask()">🗄 Отменить</button>
                
                <!-- Кнопки для переданных мной -->
                <button class="btn-revive" id="btn-return" onclick="returnTask()">↩️ Вернуть</button>

                <!-- Кнопки для архива -->
                <button class="btn-revive" id="btn-revive" onclick="reviveTask()">🔄 Восстановить</button>
                <button class="btn-delete" id="btn-delete-hard" onclick="deleteHardTask()">🗑 Удалить навсегда</button>

                <!-- Кнопки для полученных задач -->
                <button class="btn-delete" id="btn-reject" onclick="rejectTask()">🚫 Отклонить</button>
            </div>
        </div>
    </div>

    <!-- Модалка передачи -->
    <div id="transfer-modal" class="modal">
        <div class="modal-content">
            <h2>Передать задачу</h2>
            <input type="text" id="transfer-username" placeholder="@username получателя">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('transfer-modal')">Отмена</button>
                <button class="btn-submit" onclick="transferTask()">Передать</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id;
        const API_URL = "https://твоя-ссылка.ngrok-free.dev"; // НЕ ЗАБУДЬ ПОМЕНЯТЬ!

        const listElement = document.getElementById('task-list');
        let currentTab = 'my';
        let editingTaskId = null;

        function switchTab(tab, element) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            loadTasks();
        }

        function openCreateModal() {
            document.getElementById('new-text').value = '';
            document.getElementById('create-modal').classList.add('show');
            document.getElementById('new-text').focus();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        async function loadTasks() {
            if (!userId) { listElement.innerHTML = '<div class="loader">Нет ID</div>'; return; }
            listElement.innerHTML = '<div class="loader">Загрузка...</div>';
            
            let endpoint = `/tasks/${userId}`;
            if (currentTab === 'shared') endpoint = `/tasks/shared/${userId}`;
            if (currentTab === 'archive') endpoint = `/tasks/archive/${userId}`;
            
            try {
                const response = await fetch(`${API_URL}${endpoint}`, { headers: { "ngrok-skip-browser-warning": "true" } });
                const tasks = await response.json();
                
                if (tasks.length === 0) {
                    listElement.innerHTML = `<div class="loader">Пусто 🎉</div>`;
                    return;
                }
                listElement.innerHTML = '';
                tasks.forEach(task => {
                    const item = document.createElement('div');
                    item.className = 'task-item';
                    
                    let subText = task.date_to ? `<div class="task-date">до ${task.date_to}</div>` : '';
                    
                    // Логика отображения статусов для Обмена
                    if (currentTab === 'shared') {
                        const isAuthor = task.author_id === userId;
                        if (isAuthor) {
                            subText += `<div class="task-author">→ Отправлено вами (ждет выполнения)</div>`;
                        } else {
                            subText += `<div class="task-author">← Передано вам</div>`;
                        }
                    }

                    // Логика отображения статусов для Архива
                    if (currentTab === 'archive') {
                        const stText = task.status === 'done' ? '✅ Выполнено' : '✖️ Отменено';
                        subText += `<div class="task-status" style="color: ${task.status === 'done' ? 'var(--success)' : 'var(--danger)'}">${stText}</div>`;
                    }

                    const safeBody = task.body.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    
                    // В архиве нет чекбокса
                    const checkboxHTML = currentTab === 'archive' ? '' : 
                        (currentTab === 'shared' && task.author_id === userId ? '' : // В отправленных мной не показываем чекбокс
                        `<div class="checkbox" onclick="event.stopPropagation(); completeTask(${task.id}, this.parentElement)"></div>`);

                    // В обмене нет карандаша для редактирования
                    const editIconHTML = currentTab === 'shared' ? '' : `<div class="edit-icon" onclick="event.stopPropagation(); openEditModal(${task.id}, '${safeBody}')">✏️</div>`;

                    item.innerHTML = `
                        ${checkboxHTML}
                        <div class="task-content" onclick="openEditModal(${task.id}, '${safeBody}')">
                            <div>#${task.id} ${task.body}</div>
                            ${subText}
                        </div>
                        ${editIconHTML}
                    `;
                    listElement.appendChild(item);
                });
            } catch (error) {
                listElement.innerHTML = '<div class="loader">Ошибка API</div>';
            }
        }

        async function completeTask(taskId, itemElement) {
            itemElement.style.opacity = 0.5;
            try {
                await fetch(`${API_URL}/tasks/complete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ task_id: taskId, user_id: userId })
                });
                itemElement.style.display = 'none';
            } catch (error) {
                itemElement.style.opacity = 1;
                alert('Ошибка закрытия');
            }
        }

        function openEditModal(taskId, currentText) {
            editingTaskId = taskId;
            document.getElementById('edit-text').value = currentText;
            document.getElementById('edit-modal').classList.add('show');

            const btnTransfer = document.getElementById('btn-transfer');
            const btnArchive = document.getElementById('btn-archive');
            const btnReturn = document.getElementById('btn-return');
            const btnRevive = document.getElementById('btn-revive');
            const btnDeleteHard = document.getElementById('btn-delete-hard');
            const btnReject = document.getElementById('btn-reject');
            const editText = document.getElementById('edit-text');
            const editDays = document.getElementById('edit-days');
            const saveBtn = document.querySelector('#edit-modal .btn-submit');

            // Скрываем всё по умолчанию
            [btnTransfer, btnArchive, btnReturn, btnRevive, btnDeleteHard, btnReject].forEach(b => b.style.display = 'none');
            
            if (currentTab === 'my') {
                btnTransfer.style.display = 'block';
                btnArchive.style.display = 'block';
                editText.disabled = false;
                editDays.disabled = false;
                saveBtn.style.display = 'block';
            } else if (currentTab === 'shared') {
                editText.disabled = true;
                editDays.disabled = true;
                saveBtn.style.display = 'none';
                // Если я автор - могу вернуть
                if (window.currentTaskAuthorId === userId) {
                    btnReturn.style.display = 'block';
                    btnArchive.style.display = 'block';
                } else {
                    // Если мне передали - могу отклонить
                    btnReject.style.display = 'block';
                }
            } else if (currentTab === 'archive') {
                btnRevive.style.display = 'block';
                btnDeleteHard.style.display = 'block';
                editText.disabled = false;
                editDays.disabled = false;
                saveBtn.style.display = 'block';
            }
        }

        // Дополнительная переменная для хранения автора (нужна для логики обмена)
        let currentTaskAuthorId = null;

        async function saveEdit() {
            const fullText = document.getElementById('edit-text').value.trim();
            const days = document.getElementById('edit-days').value;
            if (!fullText) { tg.showAlert("Текст не может быть пустым"); return; }
            try {
                const response = await fetch(`${API_URL}/tasks/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ task_id: editingTaskId, user_id: userId, full_text: fullText, days: days ? parseInt(days) : null })
                });
                if (!response.ok) throw new Error('Ошибка');
                closeModal('edit-modal');
                loadTasks();
            } catch (error) { tg.showAlert("Ошибка при сохранении"); }
        }

        async function cancelTask() {
            tg.showConfirm("Отменить задачу (в архив)?", async (confirmed) => {
                if (!confirmed) return;
                try {
                    await fetch(`${API_URL}/tasks/cancel`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                        body: JSON.stringify({ task_id: editingTaskId, user_id: userId })
                    });
                    closeModal('edit-modal');
                    loadTasks();
                } catch (e) { tg.showAlert("Ошибка"); }
            });
        }

        async function returnTask() {
            try {
                const res = await fetch(`${API_URL}/tasks/reject`, { // reject меняет user_id на author_id, то есть возвращает
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ task_id: editingTaskId, user_id: userId })
                });
                if (!res.ok) throw new Error('Ошибка');
                closeModal('edit-modal');
                loadTasks();
            } catch (e) { tg.showAlert("Ошибка возврата"); }
        }

        async function rejectTask() {
            tg.showConfirm("Вернуть задачу отправителю?", async (confirmed) => {
                if (!confirmed) return;
                try {
                    await fetch(`${API_URL}/tasks/reject`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                        body: JSON.stringify({ task_id: editingTaskId, user_id: userId })
                    });
                    closeModal('edit-modal');
                    loadTasks();
                } catch (e) { tg.showAlert("Ошибка отклонения"); }
            });
        }

        async function reviveTask() {
            try {
                const res = await fetch(`${API_URL}/tasks/revive`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ task_id: editingTaskId, user_id: userId })
                });
                if (!res.ok) throw new Error('Ошибка');
                closeModal('edit-modal');
                loadTasks();
            } catch (e) { tg.showAlert("Ошибка восстановления"); }
        }

        async function deleteHardTask() {
            tg.showConfirm("Удалить навсегда?", async (confirmed) => {
                if (!confirmed) return;
                try {
                    await fetch(`${API_URL}/tasks/${editingTaskId}?user_id=${userId}`, {
                        method: 'DELETE',
                        headers: { 'ngrok-skip-browser-warning': 'true' }
                    });
                    closeModal('edit-modal');
                    loadTasks();
                } catch (e) { tg.showAlert("Ошибка удаления"); }
            });
        }

        function openTransferModal() {
            document.getElementById('transfer-username').value = '';
            closeModal('edit-modal');
            document.getElementById('transfer-modal').classList.add('show');
        }

        async function transferTask() {
            const username = document.getElementById('transfer-username').value.trim();
            if (!username) { tg.showAlert("Введите @username"); return; }
            try {
                const res = await fetch(`${API_URL}/tasks/transfer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ task_id: editingTaskId, from_user_id: userId, to_username: username })
                });
                if (!res.ok) throw new Error('Ошибка');
                closeModal('transfer-modal');
                loadTasks();
            } catch (e) { tg.showAlert("Ошибка передачи"); }
        }

        async function createTask() {
            const fullText = document.getElementById('new-text').value.trim();
            const days = document.getElementById('new-days').value;
            if (!fullText) { tg.showAlert("Напишите, что нужно сделать"); return; }
            try {
                const response = await fetch(`${API_URL}/tasks/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ user_id: userId, full_text: fullText, days: days ? parseInt(days) : null })
                });
                if (!response.ok) throw new Error('Ошибка');
                closeModal('create-modal');
                loadTasks();
            } catch (error) { tg.showAlert("Ошибка создания"); }
        }

        loadTasks();
    </script>
</body>
</html>
